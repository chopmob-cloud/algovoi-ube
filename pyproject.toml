[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-ube"
version = "0.1.0"
description = "Independent NTI-1 conformance harness: audit chain, fail-closed halt, and a Keystone coverage map"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AlgoVoi" }]
keywords = ["nti", "agent", "trust", "conformance", "audit", "keystone"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# No runtime dependencies: the harness is stdlib only, so it runs anywhere.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.urls]
Homepage = "https://docs.algovoi.co.uk/keystone"

[project.scripts]
algovoi-ube = "algovoi_ube.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
