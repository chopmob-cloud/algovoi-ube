[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-ube"
version = "0.1.0"
description = "Independent NTI-1 conformance harness and Layer 0 substrate: audit chain, fail-closed halt, ML-DSA signing core, Merkle revocation registry, and a Keystone coverage map"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AlgoVoi" }]
keywords = ["nti", "agent", "trust", "conformance", "audit", "keystone", "ml-dsa", "dilithium", "merkle"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# No Python runtime dependencies: the harness is stdlib only, so it runs
# anywhere. The mandatory signature scheme lives in a separate Rust binary,
# rust/nti-signer, which is why no cryptography package appears here. When that
# binary is absent every signing path raises rather than downgrading.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]
layer0 = ["pqcrypto>=0.4,<2", "jcs>=0.2"]
layer0-test = ["pytest>=7.4", "pqcrypto>=0.4,<2", "jcs>=0.2"]

[project.urls]
Homepage = "https://docs.algovoi.co.uk/keystone"

[project.scripts]
algovoi-ube = "algovoi_ube.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# The Rust core is not a Python dependency, but the tests that exercise it are
# skipped when it is absent. CI builds it first so a missing core cannot read as
# a green run. See scripts/build_signer.sh.
