[package]
name = "nti-signer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Isolated ML-DSA signing core for NTI-1 receipts. Keys never leave this process."

[[bin]]
name = "nti-signer"
path = "src/main.rs"

[dependencies]
# ML-DSA (FIPS 204), the standardised form of CRYSTALS-Dilithium. MlDsa87 is
# NIST security category 5, which is what NTI-1 names as Dilithium5.
ml-dsa = "0.1"
signature = "2"
# Serde-free on purpose: the wire format here is a length-prefixed line protocol,
# so the signing core has no JSON parser to attack and no field ordering to get
# wrong. Canonicalisation happens on the Python side, which is where the receipt
# is assembled.
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
