name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Harness self test
        run: python conformance/run.py --self-test

  evidence:
    # The evidence is regenerated on every push and compared with what is
    # committed. If a claim no longer holds, this fails rather than going stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate evidence
        run: python evidence/collect.py
      - name: Fail if the committed evidence is out of date
        run: |
          if ! git diff --quiet -- evidence/evidence.json; then
            echo "evidence.json changed: a finding no longer matches the input."
            git diff -- evidence/evidence.json
            exit 1
          fi
          echo "evidence matches the inputs it was generated from"
